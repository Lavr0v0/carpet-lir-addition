plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.11'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://masa.dy.fi/maven' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "carpet:fabric-carpet:${project.carpet_core_version}"
}

loom {
    splitEnvironmentSourceSets()
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_dependency', "~${project.minecraft_version}"
    inputs.property 'loader_dependency', ">=${project.loader_version}"

    filesMatching('fabric.mod.json') {
        expand(
                version: project.version,
                minecraft_dependency: "~${project.minecraft_version}",
                loader_dependency: ">=${project.loader_version}",
                target_profile: project.minecraft_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
